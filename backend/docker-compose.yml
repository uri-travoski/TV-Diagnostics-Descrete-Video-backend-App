# Standalone Docker Compose for TV Diagnostics Backend
# Pre-built container image hosted on GitHub Container Registry (GHCR):
# ghcr.io/uri-travoski/tv-diagnostics-backend:latest

services:
  tv-diagnostics-backend:
    image: ghcr.io/uri-travoski/tv-diagnostics-backend:latest
    container_name: tv-diagnostics-backend
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PIN_CODE=482061            # Default numeric PIN used to unlock Vault on TV
      - NOTES_PIN=1234             # 4-digit numeric PIN used to unlock Notes on TV app
      - PORT=8090
      - SCAN_ON_STARTUP=true
      - SCAN_INTERVAL_MINUTES=30
      - MOUNT_POLL_INTERVAL_SECONDS=5 # Poll interval while waiting for SMB drive to mount
      - VIDEO_DIRS=/videos         # Mounted directory inside the container
    volumes:
      # Mount video folders here (replace ./sample_videos with your host/SMB video path)
      - ./sample_videos:/videos
      
      # Persistent storage for metadata database, backups, and generated 60s thumbnails
      - ./data:/app/data

    # Optional: uncomment below if building locally from source
    # build:
    #   context: .
    #   dockerfile: Dockerfile
